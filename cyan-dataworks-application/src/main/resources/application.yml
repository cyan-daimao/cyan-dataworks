spring:
  profiles:
    active: dev
  application:
    name: cyan-dataworks
  main:
    web-application-type: servlet
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
flink:
  rest:
    url: http://10.0.0.2:18083
    preview-poll-times: 10
    preview-poll-interval-ms: 500
    preview-max-result-pages: 20
    preview-max-result-rows: 100
  iceberg-catalog:
    enabled: true
    name: iceberg
    type: iceberg
    catalog-type: rest
    uri: http://gravitino-iceberg-rest-server.gravitino.svc.cluster.local:9001/iceberg
    s3-endpoint: http://10.0.0.2:9000
    s3-access-key-id: rustfsadmin
    s3-secret-access-key: rustfsadmin
    s3-path-style-access: true
  operator:
    enabled: true
    namespace: flink
    image: harbor.cyan.com/cyan/flink-sql:2.0.1
    jar-uri: local:///opt/flink/lib/sql-runner.jar
    entry-class: com.cyan.dataman.infra.flink.SqlRunner
    parallelism: 1
