spring:
  config:
    import:
      - "nacos:arch-base.yaml?group=DEFAULT_GROUP&tenant=prod"
  application:
    name: cyan-employee
  cloud:
    nacos:
      # 通用配置（配置中心和注册中心可共享）
      server-addr: 10.0.0.2:8848
      username: nacos
      password: nacos
      # 配置中心专项配置
      config:
        file-extension: yaml
        namespace: prod
      # 注册中心专项配置
      discovery:
        ephemeral: true
        namespace: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://10.0.0.2:3306/cyan_dataworks
  data:
    redis:
      host: 10.0.0.2
      port: 30379
      password: 123456